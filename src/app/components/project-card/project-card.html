<article
  class="group flex h-full flex-col rounded-2xl border border-gray-200/80 bg-white/75 p-6 shadow-[0_16px_40px_rgba(15,23,42,0.08)] backdrop-blur-xl transition-all duration-300 hover:-translate-y-1 hover:border-(--primary-color)/50 hover:shadow-[0_18px_45px_rgba(79,70,229,0.12)] dark:border-white/10 dark:bg-slate-900/60 dark:shadow-[0_16px_40px_rgba(0,0,0,0.25)]"
>
  <div class="mb-5 flex items-center justify-between gap-3">
    <h3 class="text-xl font-bold text-gray-900 dark:text-white">{{ data.title }}</h3>
    <button
      type="button"
      [attr.aria-expanded]="description"
      [attr.aria-label]="description ? 'Hide project description' : 'Show project description'"
      class="rounded-full border border-gray-200 bg-gray-100 px-2.5 py-1 text-[10px] font-semibold uppercase tracking-[0.12em] text-gray-600 transition-colors hover:border-(--primary-color)/40 hover:text-(--primary-color) dark:border-white/10 dark:bg-white/5 dark:text-gray-300 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-(--primary-color)/30"
      (click)="toggleDescription()"
    >
      {{ description ? 'Hide' : 'Read' }}
    </button>
  </div>

  <div class="mb-6 min-h-[110px]">
    <p class="text-sm leading-6 text-gray-600 dark:text-gray-300">
      {{ summaryText }}
    </p>
  </div>

  <div class="mt-auto">
    <a
      [href]="data.link"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="'Open project: ' + data.title"
      class="inline-flex items-center justify-center rounded-xl bg-(--btn-color) px-4 py-2.5 text-sm font-semibold text-(--btn-text-color) shadow-sm hover:bg-(--btn-hover-color) focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-(--primary-color)/30"
    >
      {{ data.btnLabel }}
    </a>
  </div>
</article>
